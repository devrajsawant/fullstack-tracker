<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>26-Week FullStack Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0d;
        --bg1: #111111;
        --bg2: #161616;
        --bg3: #1c1c1c;
        --line: #252525;
        --line2: #2e2e2e;
        --dim: #444444;
        --muted: #666666;
        --sub: #888888;
        --body: #b0b0b0;
        --text: #e0e0e0;
        --bright: #f0f0f0;
        --green: #10bc4f;
        --green-dim: #1a3327;
        --amber: #f59e0b;
        --amber-dim: #2d2008;
        --blue: #60a5fa;
        --blue-dim: #0f1e35;
        --mono: "JetBrains Mono", monospace;
        --r: 4px;
      }

      body {
        font-family: var(--mono);
        background: var(--bg);
        color: var(--body);
        min-height: 100vh;
        font-size: 15px;
        line-height: 1.6;
      }

      /* ── LAYOUT ── */
      .shell {
        margin: 0 auto;
        padding: 0 50px 80px;
      }

      /* ── HEADER ── */
      .hdr {
        padding: 40px 0 28px;
        border-bottom: 1px solid var(--line);
      }
      .hdr-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 16px;
      }
      .hdr-title {
        font-size: 20px;
        font-weight: 500;
        color: var(--bright);
        letter-spacing: -0.3px;
      }
      .hdr-title span {
        color: var(--green);
      }
      .hdr-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .hdr-meta b {
        color: var(--sub);
        font-weight: 400;
      }

      .stats {
        display: flex;
        gap: 32px;
      }
      .stat {
        text-align: right;
      }
      .stat-n {
        font-size: 22px;
        font-weight: 500;
        color: var(--text);
      }
      .stat-l {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-top: 1px;
      }
      #n-done {
        color: var(--green);
      }
      #n-prog {
        color: var(--amber);
      }

      /* ── PROGRESS ── */
      .prog-bar-wrap {
        margin-top: 20px;
      }
      .prog-bar-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .prog-track {
        height: 2px;
        background: var(--line2);
      }
      .prog-fill {
        height: 100%;
        width: 0%;
        background: var(--green);
        transition: width 0.5s ease;
      }

      /* ── PHASE NAV ── */
      .phase-nav {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--line);
        margin-top: 32px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .phase-nav::-webkit-scrollbar {
        display: none;
      }
      .ph-btn {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        background: none;
        border: none;
        border-bottom: 1px solid transparent;
        padding: 10px 20px 11px;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .ph-btn:hover {
        color: var(--body);
      }
      .ph-btn.on {
        color: var(--green);
        border-bottom-color: var(--green);
      }

      /* ── PHASE PANEL ── */
      .phase-panel {
        display: none;
      }
      .phase-panel.on {
        display: block;
      }

      .milestone-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0 20px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .milestone-row::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border: 1px solid var(--green);
        background: var(--green);
        border-radius: 50%;
        flex-shrink: 0;
      }
      .milestone-row span {
        color: var(--green);
      }

      /* ── WEEK LIST ── */
      .week-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      /* ── WEEK ROW ── */
      .wrow {
        background: var(--bg1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }
      .wrow.s-done {
        border-left: 2px solid var(--green);
      }
      .wrow.s-prog {
        border-left: 2px solid var(--amber);
      }
      .wrow.s-pending {
        border-left: 2px solid transparent;
      }

      .wrow-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        cursor: pointer;
        user-select: none;
      }
      .wrow-head:hover {
        background: var(--bg2);
      }

      .wnum {
        font-size: 10px;
        color: var(--dim);
        min-width: 40px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .wtopic {
        font-size: 13px;
        color: var(--text);
        font-weight: 500;
        flex: 1;
      }
      .wassign {
        font-size: 11px;
        color: var(--muted);
        flex: 1;
      }
      .wbadge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 2px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 500;
      }
      .badge-done {
        background: var(--green-dim);
        color: var(--green);
      }
      .badge-prog {
        background: var(--amber-dim);
        color: var(--amber);
      }
      .badge-pending {
        background: var(--bg3);
        color: var(--dim);
      }

      .wdate {
        font-size: 11px;
        color: var(--muted);
        min-width: 80px;
        text-align: right;
        flex-shrink: 0;
      }

      /* ── EXPAND ── */
      .wrow-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        border-top: 0px solid var(--line);
      }
      .wrow-body.open {
        max-height: 700px;
        border-top: 1px solid var(--line);
      }

      .body-inner {
        padding: 20px 16px 20px 68px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .sect-head {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .sect-body {
        font-size: 12px;
        color: var(--sub);
        line-height: 1.7;
      }
      .sect-body a {
        color: var(--blue);
        text-decoration: none;
      }
      .sect-body a:hover {
        text-decoration: underline;
      }

      .resource-list {
        list-style: none;
      }
      .resource-list li {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--sub);
      }
      .resource-list li::before {
        content: "→";
        color: var(--dim);
        flex-shrink: 0;
        margin-top: 1px;
      }

      .focus-tag {
        display: inline-block;
        background: var(--blue-dim);
        color: var(--blue);
        border-radius: 2px;
        padding: 2px 8px;
        font-size: 11px;
        margin-right: 4px;
        margin-bottom: 4px;
      }

      /* ── FORM SECTION ── */
      .form-sect {
        grid-column: 1/-1;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr 2fr;
        gap: 10px;
        align-items: end;
      }

      label.fl {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin-bottom: 5px;
      }
      select,
      input[type="date"],
      textarea {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--bg);
        border: 1px solid var(--line2);
        border-radius: var(--r);
        color: var(--text);
        padding: 7px 10px;
        outline: none;
        width: 100%;
        transition: border-color 0.15s;
      }
      select:focus,
      input[type="date"]:focus,
      textarea:focus {
        border-color: var(--dim);
      }
      option {
        background: var(--bg2);
      }
      textarea {
        resize: vertical;
        min-height: 52px;
      }

      .notes-wrap {
        grid-column: 1/-1;
      }
      .notes-wrap textarea {
        min-height: 60px;
      }

      .save-row {
        grid-column: 1/-1;
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
      }
      .save-btn {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        padding: 7px 20px;
        background: none;
        border: 1px solid var(--line2);
        color: var(--sub);
        border-radius: var(--r);
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.15s;
      }
      .save-btn:hover {
        border-color: var(--green);
        color: var(--green);
      }

      /* ── RESPONSIVE ── */
      @media (max-width: 680px) {
        .stats {
          gap: 20px;
        }
        .body-inner {
          grid-template-columns: 1fr;
          padding: 16px;
        }
        .form-row {
          grid-template-columns: 1fr 1fr;
        }
        .wassign {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- HEADER -->
      <header class="hdr">
        <div class="hdr-top">
          <div>
            <div class="hdr-title">fullstack/<span>tracker</span></div>
            <div class="hdr-meta">
              26-week mentorship plan &nbsp;·&nbsp; <b>target:</b> ₹8–15 LPA
              &nbsp;·&nbsp; <b>stack:</b> Node · TS · PostgreSQL · Redis ·
              Docker · AWS

          </div>

              <div class="stat-l">Done</div>
            </div>
            <div class="stat">
              <div class="stat-n" id="n-prog">0</div>
              <div class="stat-l">Active</div>
            </div>
            <div class="stat">
              <div class="stat-n" id="n-rem">26</div>
              <div class="stat-l">Left</div>
            </div>
          </div>
        </div>
        <div class="prog-bar-wrap">
          <div class="prog-bar-meta">
            <span>progress</span>
            <span id="pct-lbl">0 / 26 weeks complete</span>
          </div>
          <div class="prog-track">
            <div class="prog-fill" id="prog-fill"></div>
          </div>
        </div>
      </header>

      <!-- PHASE NAV -->
      <nav class="phase-nav" id="phase-nav"></nav>

      <!-- PANELS -->
      <div id="panels"></div>
    </div>

      const PHASES = [
        {
          id: 0,
          label: "Phase 1 — Backend Core",
          range: "Wk 1–6",
          milestone: "Comfortable backend developer",
        },
        {
          id: 1,
          label: "Phase 2 — Database & Cache",
          range: "Wk 7–12",
          milestone: "Production backend features",
        },
        {
          id: 2,
          label: "Phase 3 — Advanced Backend",
          range: "Wk 13–18",
          milestone: "Advanced backend engineer",
        },
        {
          id: 3,
          label: "Phase 4 — DevOps & Scale",
          range: "Wk 19–26",
          milestone: "Portfolio-ready full stack engineer",
        },
      ];

      function loadData() {
        try {
          return JSON.parse(localStorage.getItem("fst2") || "{}");
        } catch {
          return {};
        }
      }
      function saveData(d) {
        localStorage.setItem("fst2", JSON.stringify(d));
      }
      let D = loadData(),
        activePhase = 0,
        openWeek = null;

      function build() {
        const nav = document.getElementById("phase-nav");
        const panels = document.getElementById("panels");
        nav.innerHTML = "";
        panels.innerHTML = "";

        PHASES.forEach((ph) => {
          const btn = document.createElement("button");
          btn.className = "ph-btn" + (ph.id === activePhase ? " on" : "");
          btn.textContent = ph.label + " (" + ph.range + ")";
          btn.onclick = () => {
            activePhase = ph.id;
            build();
          };
          nav.appendChild(btn);

          const panel = document.createElement("div");
          panel.className =
            "phase-panel" + (ph.id === activePhase ? " on" : "");

          panel.innerHTML = `<div class="milestone-row" style="margin-top:24px">milestone &rarr; <span>${ph.milestone}</span></div>`;

          const list = document.createElement("div");
          list.className = "week-list";
          WEEKS.filter((w) => w.ph === ph.id).forEach((w) => {
            list.appendChild(makeRow(w));
          });
          panel.appendChild(list);
          panels.appendChild(panel);
        });

        updateStats();
      }

      function makeRow(w) {
        const d = D[w.w] || {};
        const st = d.status || "pending";
        const stMap = {
          done: "s-done",
          "in-progress": "s-prog",
          pending: "s-pending",
        };
        const badgeMap = {
          done: "badge-done",
          "in-progress": "badge-prog",
          pending: "badge-pending",
        };
        const badgeTxt = {
          done: "done",
          "in-progress": "active",
          pending: "pending",
        };

        const row = document.createElement("div");
        row.className = "wrow " + stMap[st];
        row.id = "wrow-" + w.w;

        const isOpen = openWeek === w.w;
        row.innerHTML = `
    <div class="wrow-head" onclick="toggle(${w.w})">
      <span class="wnum">wk ${String(w.w).padStart(2, "0")}</span>
      <span class="wtopic">${w.topic}</span>
      <span class="wassign">${w.assign}</span>
      <span class="wbadge ${badgeMap[st]}">${badgeTxt[st]}</span>
      <span class="wdate">${d.date || ""}</span>
    </div>
    <div class="wrow-body ${isOpen ? "open" : ""}" id="body-${w.w}">
      <div class="body-inner">
        <div>
          <div class="sect-head">Practice Project</div>
          <div class="sect-body">${w.project}</div>
        </div>
        <div>
          <div class="sect-head" style="margin-top:12px">Interview Focus</div>
          <div>${w.interview.map((i) => `<span class="focus-tag">${i}</span>`).join("")}</div>
        </div>
        <div class="form-sect">
          <div class="form-row">
            <div>
              <label class="fl">Status</label>
              <select id="sel-${w.w}" onchange="quickSave(${w.w})">
                <option value="pending" ${st === "pending" ? "selected" : ""}>pending</option>
                <option value="in-progress" ${st === "in-progress" ? "selected" : ""}>in progress</option>
                <option value="done" ${st === "done" ? "selected" : ""}>done</option>
              </select>
            </div>
            <div>
              <label class="fl">Completed on</label>
              <input type="date" id="date-${w.w}" value="${d.date || ""}" onchange="quickSave(${w.w})">
            </div>
            <div class="notes-wrap">
              <label class="fl">Notes</label>
              <textarea id="note-${w.w}" placeholder="learnings, blockers, resources used...">${d.notes || ""}</textarea>
            </div>
            <div class="save-row">
              <button class="save-btn" onclick="saveRow(${w.w})">save →</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
        return row;
      }

      function toggle(week) {
        openWeek = openWeek === week ? null : week;
        build();
        if (openWeek) {
          setTimeout(() => {
            const el = document.getElementById("wrow-" + openWeek);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 50);
        }
      }

      function quickSave(week) {
        const sel = document.getElementById("sel-" + week);
        const date = document.getElementById("date-" + week);
        if (!D[week]) D[week] = {};
        D[week].status = sel.value;
        D[week].date = date.value;
        saveData(D);
        const row = document.getElementById("wrow-" + week);
        row.className =
          "wrow " +
          { done: "s-done", "in-progress": "s-prog", pending: "s-pending" }[
            sel.value
          ];
        const badge = row.querySelector(".wbadge");
        badge.className =
          "wbadge " +
          {
            done: "badge-done",
            "in-progress": "badge-prog",
            pending: "badge-pending",
          }[sel.value];
        badge.textContent = {
          done: "done",
          "in-progress": "active",
          pending: "pending",
        }[sel.value];
        row.querySelector(".wdate").textContent = date.value;
        updateStats();
      }

      function saveRow(week) {
        const sel = document.getElementById("sel-" + week);
        const date = document.getElementById("date-" + week);
        const note = document.getElementById("note-" + week);
        const link = document.getElementById("link-" + week);
        if (!D[week]) D[week] = {};
        D[week].status = sel.value;
        D[week].date = date.value;
        D[week].notes = note.value;
        D[week].link = link.value;
        saveData(D);
        openWeek = null;
        build();
      }

      function updateStats() {
        const vals = WEEKS.map((w) => (D[w.w] || {}).status || "pending");
        const done = vals.filter((v) => v === "done").length;
        const prog = vals.filter((v) => v === "in-progress").length;
        document.getElementById("n-done").textContent = done;
        document.getElementById("n-prog").textContent = prog;
        document.getElementById("n-rem").textContent = 26 - done - prog;
        document.getElementById("pct-lbl").textContent =
          done + " / 26 weeks complete";
        document.getElementById("prog-fill").style.width =
          Math.round((done / 26) * 100) + "%";
      }

      build();
    </script>
